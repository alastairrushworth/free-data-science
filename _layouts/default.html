<!DOCTYPE html>
<html lang="{{ site.lang | default: "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <nav class="topbar">
      <div class="wrap">
        <a class="ghlink" href="https://github.com/alastairrushworth/free-data-science">View on GitHub &#8599;</a>
      </div>
    </nav>
    <main class="content">
      <div class="wrap">
        {{ content }}
      </div>
    </main>
    <footer class="site-footer">
      <div class="wrap">
        Curated free data science resources &middot; Found a mistake or broken link?
        <a href="https://github.com/alastairrushworth/free-data-science/issues">Open an issue</a>.
      </div>
    </footer>
  </body>
</html>
