# lychee link-checker configuration — https://lychee.cli.rs
# Edit this file (not the workflow) to tune behaviour or silence false positives.

# Cache responses between CI runs to reduce requests and transient failures.
cache = true
max_cache_age = "1d"

# Be patient and forgiving with slow or rate-limited hosts.
max_retries = 3
retry_wait_time = 5
timeout = 30
max_concurrency = 8
no_progress = true

# Anti-bot / auth responses still mean the page exists — treat them as OK,
# matching the old checker's behaviour (401/403/429).
accept = ["200..=299", "401", "403", "429"]

# A realistic user agent; some hosts block default crawler agents.
user_agent = "Mozilla/5.0 (compatible; lychee; +https://github.com/alastairrushworth/free-data-science)"

# The list has no email links to verify.
exclude_mail = true

# Known false-positives go here as regexes, e.g.:
#   exclude = ['^https://www\.example\.com/']
exclude = []
